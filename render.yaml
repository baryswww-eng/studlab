# Render Blueprint: PostgreSQL + FastAPI backend + Next.js site.
# Render → New → Blueprint → choose this repository. Secrets marked `sync: false`
# (GEMINI_API_KEY) are entered by you in the Render dashboard, never committed.

databases:
  - name: studlab-db
    plan: free
    databaseName: studlab
    user: studlab

services:
  - type: web
    name: studlab-kz-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studlab-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://studlab-kz.onrender.com
      - key: AI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite
      - key: AI_TIMEOUT_SECONDS
        value: "45"

  - type: web
    name: studlab-kz
    runtime: docker
    rootDir: frontend
    plan: free
    region: frankfurt
    envVars:
      # Where the site's server and /api proxy reach the backend.
      - key: API_INTERNAL_URL
        value: https://studlab-kz-api.onrender.com
